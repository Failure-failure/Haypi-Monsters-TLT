<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monster Tower Home</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    background: linear-gradient(#7ec8ff, #d6f0ff);
  }

  .sky-title {
    position: absolute;
    top: 15px;
    width: 100%;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: white;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
  }

  .tower {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 140px;
    height: 320px;
    display: flex;
    flex-direction: column-reverse;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .floor {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    color: white;
  }

  .bronze { background: #cd7f32; }
  .silver { background: #c0c0c0; }
  .gold { background: #d4af37; }
  .amber { background: #ffbf00; }
  .diamond { background: #b9f2ff; color: black; }

  .left-menu, .right-menu {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .left-menu { left: 20px; }
  .right-menu { right: 20px; }

  .btn {
    width: 90px;
    padding: 10px;
    background: rgba(0,0,0,0.6);
    color: white;
    text-align: center;
    border-radius: 10px;
    cursor: pointer;
    font-size: 12px;
  }

  .bottom-bar {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 90px;
    background: rgba(20, 20, 20, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
  }

  .icon {
    width: 45px;
    height: 45px;
    background: #444;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 10px;
    cursor: pointer;
  }

  .monster-btn {
    width: 70px;
    height: 70px;
    background: gold;
    border-radius: 50%;
    border: 3px solid white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    cursor: pointer;
    transform: translateY(-20px);
  }
</style>
</head>
<body>

<div class="sky-title">The Lost Tower</div>

<div class="tower">
  <div class="floor bronze">Bronze</div>
  <div class="floor silver">Silver</div>
  <div class="floor gold">Gold</div>
  <div class="floor amber">Amber</div>
  <div class="floor diamond">Diamond</div>
</div>

<div class="left-menu">
  <div class="btn" onclick="openShop()">Shop</div>
  <div class="btn" onclick="openMonsterHome()">Monster Home</div>
</div>

<div class="right-menu">
  <div class="btn" onclick="openEggs()">Eggs</div>
  <div class="btn" onclick="openDungeons()">Dungeons</div>
  <div class="btn" onclick="openExplore()">Explore</div>
</div>

<div class="bottom-bar">
  <div class="icon" onclick="openChat()">Chat</div>
  <div class="monster-btn" onclick="openMonsters()">Monsters</div>
  <div class="icon" onclick="openInventory()">Inv</div>
  <div class="icon" onclick="openLeaderboard()">LB</div>
  <div class="icon" onclick="openSocial()">Social</div>
  <div class="icon" onclick="openMail()">Mail</div>
</div>

<script src="game.js"></script>

</body>
</html>
