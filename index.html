<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monster Tower Home</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    background: url('https://via.placeholder.com/1200x800/87ceeb/ffffff') center/cover no-repeat;
  }

  /* TOP BAR */
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 55px;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    color: white;
    box-sizing: border-box;
  }

  .top-left, .top-right {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .pill {
    background: rgba(255,255,255,0.15);
    padding: 6px 10px;
    border-radius: 10px;
    font-size: 12px;
  }

  .energy {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.5);
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 12px;
  }

  /* LEFT SIDE ICONS */
  .left-ui {
    position: absolute;
    left: 10px;
    top: 80px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* RIGHT SIDE WORLD NODES */
  .right-ui {
    position: absolute;
    right: 10px;
    top: 80px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .node {
    width: 95px;
    height: 95px;
    background: rgba(0,0,0,0.55);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    text-align: center;
    font-size: 12px;
    cursor: pointer;
  }

  /* CENTER TOWER AREA */
  .tower-area {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .tower-floor {
    width: 140px;
    height: 55px;
    background: rgba(255,255,255,0.8);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    cursor: pointer;
  }

  .bronze { background: #cd7f32; color: white; }
  .silver { background: #c0c0c0; }
  .gold { background: #d4af37; }
  .amber { background: #ffbf00; }
  .diamond { background: #b9f2ff; }

  /* TASK / REWARDS */
  .task-rewards {
    position: absolute;
    left: 10px;
    top: 60px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .small-btn {
    width: 70px;
    height: 40px;
    background: rgba(0,0,0,0.6);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 11px;
    cursor: pointer;
  }

</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-left">
    <div class="pill">👤 Lv29</div>
    <div class="pill">📜</div>
  </div>

  <div class="energy">⚡ 120/120</div>

  <div class="top-right">
    <div class="pill">💰 0</div>
    <div class="pill">🪙 0</div>
  </div>
</div>

<!-- TASK / REWARDS -->
<div class="task-rewards">
  <div class="small-btn" onclick="openTasks()">Tasks</div>
  <div class="small-btn" onclick="openRewards()">Rewards</div>
</div>

<!-- LEFT SIDE (like shop etc) -->
<div class="left-ui">
  <div class="node" onclick="openShop()">Shop</div>
  <div class="node" onclick="openMonsterHome()">Monster Home</div>
</div>

<!-- RIGHT SIDE (world systems) -->
<div class="right-ui">
  <div class="node" onclick="openEggs()">Eggs</div>
  <div class="node" onclick="openDungeons()">Dungeons</div>
  <div class="node" onclick="openExplore()">Exploration</div>
</div>

<!-- CENTER TOWER -->
<div class="tower-area">
  <div class="tower-floor bronze" onclick="enterFloor('bronze')">Bronze Enter</div>
  <div class="tower-floor silver" onclick="enterFloor('silver')">Silver Enter</div>
  <div class="tower-floor gold" onclick="enterFloor('gold')">Gold Enter</div>
  <div class="tower-floor amber" onclick="enterFloor('amber')">Amber Enter</div>
  <div class="tower-floor diamond" onclick="enterFloor('diamond')">Diamond Enter</div>
</div>

<script src="game.js"></script>

</body>
</html>
